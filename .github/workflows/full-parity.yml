name: Full repeated/standalone parity

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance-full-repeated-standalone-parity:
    name: conformance (full repeated/standalone parity)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Run the unsharded full parity inventory
        run: >-
          cargo test --test conformance conformance_full_repeated_standalone_parity
          -- --ignored --exact --nocapture

[package]
name = "typokat"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[workspace]
members = ["crates/*"]
default-members = [
    ".",
    "crates/typokat-core",
    "crates/typokat-surface",
    "crates/typokat-types",
    "crates/typokat-binder",
    "crates/typokat-relate",
    "crates/typokat-diagnostics",
    "crates/typokat-frontend",
    "crates/typokat-check",
    "crates/typokat-library",
    "crates/typokat-driver",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
codespan-reporting = "0.13.1"
dragonbox_ecma = "0.1.12"
jsonc-parser = "=0.33.1"
oxc_allocator = "0.137.0"
oxc_ast = "0.137.0"
oxc_ast_visit = "0.137.0"
oxc_parser = "0.137.0"
oxc_span = "0.137.0"
oxc_resolver = "=11.24.2"
rayon = "1.12.0"
rustc-hash = "2.1.2"
sha2 = "0.10.9"
smallvec = "1.15.2"
tikv-jemallocator = "0.7.0"
toml = "0.8.23"
rustix = { version = "1.1.4", features = ["fs"] }
serde_json = "1.0.145"
typokat-core = { version = "0.1.0", path = "crates/typokat-core" }
typokat-types = { version = "0.1.0", path = "crates/typokat-types" }
typokat-binder = { version = "0.1.0", path = "crates/typokat-binder" }
typokat-relate = { version = "0.1.0", path = "crates/typokat-relate" }
typokat-diagnostics = { version = "0.1.0", path = "crates/typokat-diagnostics" }
typokat-surface = { version = "0.1.0", path = "crates/typokat-surface" }
typokat-frontend = { version = "0.1.0", path = "crates/typokat-frontend" }
typokat-check = { version = "0.1.0", path = "crates/typokat-check" }
typokat-library = { version = "0.1.0", path = "crates/typokat-library" }
typokat-driver = { version = "0.1.0", path = "crates/typokat-driver" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Root facade and CLI over the layered checker workspace. Integration tests keep
# using this package while implementation layers move into member crates.

[lib]
name = "typokat"
path = "src/lib.rs"

[[bin]]
name = "typokat"
path = "src/main.rs"

[dependencies]
typokat-core.workspace = true
typokat-types.workspace = true
typokat-binder.workspace = true
typokat-relate.workspace = true
typokat-diagnostics.workspace = true
typokat-surface.workspace = true
typokat-frontend.workspace = true
typokat-check.workspace = true
typokat-library.workspace = true
typokat-driver.workspace = true
serde_json.workspace = true

# Allocator for the CLI (`src/main.rs` only — the library must not pick its
# consumers' allocator). Building the default library from source is allocation-churn
# heavy and glibc malloc costs ~20 ms per run on it; measured against mimalloc and
# snmalloc, jemalloc was fastest at the smallest RSS cost (+2.8 MB).
tikv-jemallocator.workspace = true

[dev-dependencies]
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
typokat-check = { workspace = true, features = ["test-utils"] }
typokat-core = { workspace = true, features = ["test-utils"] }

[target.'cfg(unix)'.dev-dependencies]
rustix.workspace = true

# The test suite is checker-bound, not compile-bound: at `opt-level = 0` the libtest
# run is 63.8 s, at `opt-level = 2` it is 4.95 s (conformance 7.84 s → 1.23 s). The
# optimisation is free — `line-tables-only` debuginfo saves more link/codegen time
# than opt-2 costs, so incremental `cargo test --no-run` *drops* 8.9 s → 7.5 s.
# Backtraces and line numbers survive; only debugger variable inspection is lost.
# (Optimising dependencies alone was measured and rejected: no effect — the time is
# in typokat's own code, not oxc.)
[profile.dev]
opt-level = 2
debug = "line-tables-only"
split-debuginfo = "off"

[profile.dev.package."*"]
opt-level = 3
debug = false

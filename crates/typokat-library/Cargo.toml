[package]
name = "typokat-library"
version.workspace = true
edition.workspace = true

[features]
project-local-driver-shadow = []
session-bench = ["typokat-check/session-bench"]
library-record-census = [
    "typokat-binder/test-utils",
    "typokat-check/test-utils",
    "typokat-core/test-utils",
    "typokat-frontend/test-utils",
    "typokat-relate/test-utils",
    "typokat-types/test-utils",
]
project-binder-probe = [
    "dep:typokat-relate",
    "dep:typokat-types",
    "typokat-check/measurement-counters",
]

[dependencies]
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
sha2.workspace = true
typokat-binder.workspace = true
typokat-check.workspace = true
typokat-core.workspace = true
typokat-frontend.workspace = true
typokat-library-product.workspace = true
typokat-relate = { workspace = true, optional = true }
typokat-types = { workspace = true, optional = true }

[dev-dependencies]
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
serde_json.workspace = true
syn.workspace = true
toml.workspace = true
typokat-binder = { workspace = true, features = ["test-utils"] }
typokat-check = { workspace = true, features = ["test-utils"] }
typokat-core = { workspace = true, features = ["test-utils"] }
typokat-diagnostics.workspace = true
typokat-frontend = { workspace = true, features = ["test-utils"] }
typokat-library-product = { workspace = true, features = ["test-utils"] }
typokat-relate = { workspace = true, features = ["test-utils"] }
typokat-types = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true

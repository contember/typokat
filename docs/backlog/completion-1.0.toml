# typokat — executable 1.0 completion manifest
#
# THE machine-validated source of truth for "is typokat 1.0 done?". It replaces the
# prose definition-of-done that used to live in backlog/README.md (which now links here).
# Enforced by `tests/manifest.rs` (runs under `cargo test`, so CI gates it): the validator
# fails on duplicate/missing ids, unknown backlog/divergence links, missing owners or
# witnesses, inconsistent states, an unpinned TypeScript lib audit, and Tier S/A/B
# scope families without exactly one criterion owner.
#
# Format (a small, hand-parsed TOML subset — no serde dependency, mirrors the committed
# `tooling/official-suite/scoreboard.txt` precedent of a deterministic checked-in status file):
#   * `#` comment lines and blank lines are ignored.
#   * `[meta]` opens the singleton meta table; `[[criterion]]` opens a new criterion record.
#   * Values are either a quoted string `"..."` or a bracketed array of quoted strings
#     `["a", "b"]`. No embedded `"` inside a value.
#   * Paths in `owner`, `links`, and `deps` are resolved relative to THIS file's directory
#     (docs/backlog/) and must exist. `owner = "shipped"` is the one non-path owner.
#   * Optional `scope` arrays map criteria to the stable `scope-family` ids in scope.md;
#     the validator requires every canonical Tier S/A/B family to be mapped exactly once.
#
# The four definition-of-done conditions (checker 1.0), each a `track`:
#   A  Model completeness — no construct lowers to something silently permissive.
#   B  Checker completeness — the scope.md Tier S/A/B diagnostic surface is exhausted.
#   C  Parity hygiene — no known silent-FN family; every remaining divergence is
#      deliberate, safe-direction, and documented in reference/divergences.md.
#   D  Scale + IDE — the architecture §12 phase ladder tops out (lib.d.ts → modules →
#      parallelism → incrementality; the `13` profiling gate decided either way).
# `blocks_release = "true"` marks a criterion that gates 1.0; `"false"` records an item that
# is tracked but does not gate (already a documented safe-direction divergence, or an
# independent early-signal slice). `state` is "complete" (owner "shipped") or "incomplete"
# (owner is the live backlog item).

